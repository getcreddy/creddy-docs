<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <style>
    .box { fill: #1a1a2e; stroke: #4a9eff; stroke-width: 2; rx: 8; }
    .box-secondary { fill: #1a1a2e; stroke: #6b7280; stroke-width: 1.5; rx: 6; }
    .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #e5e5e5; }
    .label-bold { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #ffffff; font-weight: 600; }
    .label-small { font-family: ui-monospace, monospace; font-size: 11px; fill: #9ca3af; }
    .label-code { font-family: ui-monospace, monospace; font-size: 12px; fill: #22d3ee; }
    .arrow { stroke: #4a9eff; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .arrow-return { stroke: #22c55e; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); stroke-dasharray: 6 3; }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a9eff"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#0d1117" rx="12"/>
  
  <!-- Agent Box -->
  <rect x="40" y="160" width="120" height="80" class="box"/>
  <text x="100" y="205" text-anchor="middle" class="label-bold">Agent</text>
  
  <!-- Creddy Server Box -->
  <rect x="340" y="80" width="140" height="70" class="box"/>
  <text x="410" y="112" text-anchor="middle" class="label-bold">Creddy</text>
  <text x="410" y="132" text-anchor="middle" class="label-small">:8400</text>
  
  <!-- Anthropic Plugin Box -->
  <rect x="340" y="200" width="140" height="60" class="box-secondary"/>
  <text x="410" y="235" text-anchor="middle" class="label">Anthropic Plugin</text>
  
  <!-- Anthropic API Box -->
  <rect x="580" y="200" width="140" height="60" class="box"/>
  <text x="650" y="235" text-anchor="middle" class="label-bold">Anthropic API</text>
  
  <!-- Step 1: Agent to Creddy -->
  <path d="M 160 180 L 335 115" class="arrow"/>
  <text x="220" y="130" class="label-code">creddy get anthropic</text>
  
  <!-- Step 2: Creddy returns token -->
  <path d="M 335 125 L 160 190" class="arrow-return"/>
  <text x="190" y="175" class="label-code">crd_xxx</text>
  <text x="190" y="190" class="label-small">(10 min TTL)</text>
  
  <!-- Step 3: Agent calls proxy -->
  <path d="M 160 220 L 335 230" class="arrow"/>
  <text x="100" y="260" class="label-code">POST /v1/proxy/anthropic/...</text>
  
  <!-- Step 4: Plugin validates and forwards -->
  <path d="M 480 230 L 575 230" class="arrow"/>
  <text x="490" y="280" class="label-small">validates crd_xxx</text>
  <text x="490" y="295" class="label-small">swaps → sk-ant-xxx</text>
  
  <!-- Step 5: Response back -->
  <path d="M 575 245 L 160 245" class="arrow-return"/>
  <text x="350" y="340" class="label-small">response</text>
  
  <!-- Creddy to Plugin connection -->
  <path d="M 410 150 L 410 195" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 2"/>
</svg>
